substitutions:
  # Calibrated 2026-08-08: physical travel limits read from the display.
  min_height: "71.0"
  max_height: "121.0"

esphome:
  name: desk-sniffer
  friendly_name: Flexispot Desk
  on_boot:
    priority: -100  # after all components are up
    then:
      - lambda: id(mitm).request_height();

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.40.65
  ap:
    ssid: "Desk-Sniffer Fallback"

captive_portal:

# Local REST API (http://192.168.40.65) — used to drive verification without HA.
web_server:
  version: 3

uart:
  - id: uart_desk    # RX: controller TX tap (RJ45 pin 5, desk side); TX: controller RX (pin 6, desk side)
    rx_pin: GPIO17
    tx_pin: GPIO23
    baud_rate: 9600
  - id: uart_keypad  # RX only: keypad TX (RJ45 pin 6, keypad side)
    rx_pin: GPIO16
    baud_rate: 9600

desk_mitm:
  id: mitm
  desk_uart: uart_desk
  keypad_uart: uart_keypad
  pin20_sense_pin:
    number: GPIO21
    allow_other_uses: true
    mode:
      input: true
  pin20_drive_pin:
    number: GPIO22
    mode:
      output: true
  min_height: ${min_height}
  max_height: ${max_height}

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO21
      allow_other_uses: true
      mode:
        input: true
    name: "Keypad Active"
    id: pin20
    entity_category: diagnostic
    icon: mdi:gesture-tap-button
  - platform: template
    name: "Controller Awake"
    entity_category: diagnostic
    disabled_by_default: true
    icon: mdi:chip
    lambda: return id(mitm).get_controller_polling();

sensor:
  - platform: template
    name: "Height"
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    state_class: measurement
    icon: mdi:arrow-expand-vertical
    update_interval: 500ms
    lambda: |-
      float h = id(mitm).get_height();
      if (std::isnan(h)) return {};
      return h;
    filters:
      - delta: 0.01  # publish only on actual change; the lambda polls at 500ms regardless

cover:
  - platform: desk_mitm
    name: ""  # adopts the device name -> shows as "Flexispot Desk"
    icon: mdi:desk

number:
  - platform: desk_mitm
    name: "Target Height"
    unit_of_measurement: "cm"
    icon: mdi:human-male-height
    mode: box
    min_value: ${min_height}
    max_value: ${max_height}
    step: 0.1

switch:
  - platform: template
    name: "Emulation Mode"
    id: emulation_mode
    entity_category: config
    icon: mdi:robot
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(mitm).set_emulation(true);
    turn_off_action:
      - lambda: id(mitm).set_emulation(false);

button:
  - platform: template
    name: "Nudge Up"
    icon: mdi:arrow-up-bold
    on_press: [lambda: 'id(mitm).inject(0x01, 300);']
  - platform: template
    name: "Nudge Down"
    icon: mdi:arrow-down-bold
    on_press: [lambda: 'id(mitm).inject(0x02, 300);']
  - platform: template
    name: "Stop"
    icon: mdi:stop-circle-outline
    on_press: [lambda: 'id(mitm).stop();']
  - platform: template
    name: "Preset 1"
    icon: mdi:numeric-1-box
    on_press: [lambda: 'id(mitm).inject(0x04, 150);']
  - platform: template
    name: "Preset 2"
    icon: mdi:numeric-2-box
    on_press: [lambda: 'id(mitm).inject(0x08, 150);']
  - platform: template
    name: "Preset 3"
    icon: mdi:numeric-3-box
    on_press: [lambda: 'id(mitm).inject(0x10, 150);']
  - platform: template
    name: "Refresh Height"
    entity_category: diagnostic
    icon: mdi:refresh
    on_press: [lambda: 'id(mitm).request_height();']
